<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel • Chitransh Study Hub</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><b>C</b><div><strong>Chitransh Study Hub</strong><small>Admin Panel</small></div></div><a href="index.html">Student View</a></header><main><section class="adminHero"><div><span class="pill">CONTROL CENTER</span><h1>Welcome, Chitransh 👋</h1><p>Tests aur notes yahin se manage karo.</p></div><div class="stats"><div><b id="tstat">0</b><small>Tests</small></div><div><b id="nstat">0</b><small>Notes</small></div><div><b id="qstat">0</b><small>Questions</small></div></div></section><div class="adminGrid"><section class="panel"><h2>Add New Test</h2><form id="tf"><label>Test Name<input id="tn" required placeholder="CET 12th Level Mock 01"></label><div class="two"><label>Exam<select id="te"><option>Rajasthan CET</option><option>Railway ALP</option><option>Railway Group D</option><option>Railway Technician</option><option>SSC GD</option></select></label><label>Questions<input id="tq" type="number" value="100" min="1"></label></div><div class="two"><label>Time (minutes)<input id="tm" type="number" value="90" min="1"></label><label>Negative Marking<input id="neg" value="1/3"></label></div><button class="btn">+ Add Test</button></form></section><section class="panel"><h2>Add Note</h2><form id="nf"><label>Note Title<input id="nn" required placeholder="Rajasthan Geography One Shot"></label><div class="two"><label>Subject<select id="ns"><option>Rajasthan GK</option><option>Science</option><option>Maths</option><option>Reasoning</option><option>Hindi</option><option>English</option></select></label><label>PDF Link<input id="nl" placeholder="https://..."></label></div><label>Description<textarea id="nd" rows="4" placeholder="Short description"></textarea></label><button class="btn">+ Add Note</button></form></section></div><section class="panel"><div class="head"><h2>Current Content</h2><span id="msg">Ready</span></div><div id="list"></div></section></main><footer>Chitransh Study Hub <span>Founder & Developer — <b>Chitransh</b></span></footer><script src="admin.js"></script></body></html>
